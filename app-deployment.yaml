apiVersion: apps/v1
kind: Deployment
metadata: 
  name: app-url
  labels:
    app: flask-url-shortener
spec:
  replicas: 2
  selector: 
    matchLabels:
      app: flask-url-shortener
  template:
    metadata:
      labels:
        app: flask-url-shortener
    spec:
      containers: 
        - name: url-shortener
          image: airoli/airoli:latest
          imagePullPolicy: Always
          ports: 
            - containerPort: 5000
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path:  /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef: 
                name: db-secret
