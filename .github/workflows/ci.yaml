name: CI-CD

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  create-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check app.py
        run: python3 -m py_compile app.py 
      - name: set up Docker buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker hub
        uses: docker/login-action@v3 
        if: github.event_name != 'pull_request'
        with: 
          username: ${{  secrets.DOCKERHUB_USERNAME  }}
          password: ${{  secrets.DOCKERHUB_TOKEN  }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with: 
          context: .
          file: ./Dockerfile
          push: ${{  github.event_name != 'pull_request'  }}
          tags: |
             ${{  secrets.DOCKERHUB_USERNAME  }}/airoli:${{  github.sha  }}
             ${{  secrets.DOCKERHUB_USERNAME  }}/airoli:latest
          cache-from: type=gha
          cache-to: type=gha, mode=max
 

  deploy:
    needs: create-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    steps: 
      - name: Deploy new image to k3s and verify rollout
        run: |
          kubectl set image deployment/app-url url-shortener=${{ secrets.DOCKERHUB_USERNAME }}/airoli:${{ github.sha }} -n url-shortener
          kubectl rollout status deployment/app-url -n url-shortener --timeout=120s


