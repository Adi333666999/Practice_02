apiVersion: apps/v1
kind: Deployment
metadata: 
  name: url-shortener
  labels: 
    app: db-url-shortener
spec:
  replicas: 1
  strategy: 
    type: Recreate 
  selector:
    matchLabels:
      app: db-url-shortener
  template:
    metadata:
      labels:
        app: db-url-shortener
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
          args: 
            - "--innodb-flush-log-at-trx-commit=2"
            - "--skip-log-bin"
          envFrom:
            - secretRef:
                name: db-secret
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc
  
